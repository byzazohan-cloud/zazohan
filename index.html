<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#05070b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ZAZO PLAYER" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>ZAZO PLAYER</title>
</head>
<body>
  <div id="splash" class="splash-screen" aria-hidden="true">
    <div class="splash-brand">ZAZO<span>PLAYER</span></div>
    <div class="splash-wave"><i></i><i></i><i></i></div>
    <div class="splash-copy">Müzik her yerde seninle.</div>
  </div>

  <div id="app" class="app">
    <header class="topbar">
      <button class="icon-btn ghost" id="menuBtn" aria-label="Menü">☰</button>
      <button class="brand-wrap brand-button" id="searchHomeBtn" aria-label="Aramaya dön">
        <div class="brand">ZAZO <b>PLAYER</b></div>
      </button>
      <button class="icon-btn ghost" id="settingsBtn" aria-label="Ayarlar">⚙</button>
      <button class="icon-btn ghost hidden" id="powerBtn" aria-label="Düşük güç modu">◐</button>
    </header>

    <main id="view" class="view"></main>

    <div id="miniPlayer" class="mini-player hidden">
      <div class="mini-art" id="miniArt">♪</div>
      <button class="mini-meta" id="miniOpen" type="button"><strong id="miniTitle">—</strong><span id="miniType">—</span></button>
      <button id="miniPlay" class="round-btn">▶</button>
    </div>

    <nav class="bottom-nav">
      <button data-tab="music" class="nav-btn active"><span>⌕</span><small>Ara</small></button>
      <button data-tab="library" data-mode="files" class="nav-btn"><span>▥</span><small>Kütüphane</small></button>
      <button data-tab="library" data-mode="lists" class="nav-btn"><span>☷</span><small>Listeler</small></button>
      <button data-tab="library" data-mode="downloads" class="nav-btn"><span>⇩</span><small>İndirilenler</small></button>
    </nav>
  </div>

  <aside id="drawer" class="drawer hidden">
    <div class="drawer-card">
      <div class="drawer-brand">ZAZO <span>PLAYER</span></div>
      <button class="drawer-item" data-go="music">⌕ Müzik Ara</button>
      <button class="drawer-item" data-go="video">▶ Video</button>
      <button class="drawer-item" data-go="library">▥ Kütüphane</button>
      <button class="drawer-item" data-go="settings">⚙ Ayarlar</button>
      <button class="drawer-item" id="installBtn">＋ Ana Ekrana Ekle</button>
      <button class="drawer-item" id="closeDrawer">✕ Kapat</button>
    </div>
  </aside>

  <div id="playerSheet" class="sheet hidden"></div>
  <input id="fileInput" type="file" accept="audio/*,video/*" multiple hidden />

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
